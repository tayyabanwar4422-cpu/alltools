name: Deploy AllToolsHub to InfinityFree (FTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Files via FTP to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            src/**
            tsconfig.json
            vite.config.ts
            package.json
            bun.lock
            .env.example
